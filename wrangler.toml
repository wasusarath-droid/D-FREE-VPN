import express from 'express';

const app = express();

// ඔබේ අනෙකුත් සියලුම Routes මෙතැනින් පසුව ලියන්න
app.get('/', (req, res) => {
  res.send('VPN API is Running!');
});

// වැදගත්ම කොටස: Cloudflare සඳහා Export එකක් එක් කිරීම
export default {
  async fetch(request, env, ctx) {
    // මෙය Express සහ Cloudflare සම්බන්ධ කරන පාලමයි
    // සාමාන්‍යයෙන් Cloudflare වල Express කෙලින්ම run වෙන්නේ නැත
    // ඒ සඳහා '@chaos-97/cloudflare-express' වැනි adapter එකක් අවශ්‍ය විය හැක
    // නමුත් සරලවම Static assets පෙන්වීමට නම් පහත දේ කරන්න:
    
    return await env.ASSETS.fetch(request);
  }
};
